meta:
  prefix: "&8[&dEltenaSoundCore&8] &r"
command:
  help:
    header: "&fEltenaSoundCore commands:"
    reload: "&e/eltenasound reload &7- Reloads configuration files."
    play: "&e/eltenasound play <soundId> &7- Plays a sound definition."
    stop: "&e/eltenasound stop <category> [fadeOutMs] &7- Stops a sound category."
    live: "&e/eltenasound live <list|reload|play|send-manifest|send> &7- Handles live audio assets."
  reload:
    success: "&aReloaded configuration files. sounds={sounds} liveAssets={liveAssets}"
  play:
    success: "&aSent sound '{displayName}' ({soundId}) to {targetCount} players."
  stop:
    success: "&aSent stop for category {category} to {targetCount} players."
  live:
    list:
      header: "&fLive assets: {liveAssets}"
      entry: "&7- &e{assetId} &8(&b{assetType}&8) &7version=&f{version} &7category=&f{category}"
    reload:
      success: "&aReloaded live assets. sounds={sounds} liveAssets={liveAssets}"
    play:
      success: "&aSent live asset '{displayName}' ({assetId}) to your client."
    send-manifest:
      success: "&aSent the live asset manifest to {player}."
    send:
      success: "&aStarted live asset transfer: player={player} assetId={assetId}"
    error:
      unknown-asset: "&cLive asset '{assetId}' is not defined."
      player-only: "&cThis command can only be used by a player."
      unknown-player: "&cPlayer '{player}' is not online."
  error:
    no-permission: "&cYou do not have permission."
    unknown-subcommand: "&cUnknown subcommand."
    unknown-sound: "&cSound '{soundId}' is not defined."
    unknown-category: "&cCategory '{category}' is not supported."
    invalid-number: "&cThe number is invalid. Use an integer value greater than or equal to 0."
    no-targets-sound: "&eNo target players were found for sound '{displayName}'."
    no-targets-category: "&eNo target players were found for category {category}."
    player-not-ready: "&cThe target player has not completed EltenaSound ready yet."
    internal: "&cAn internal sound error occurred. Check the server log for details."
log:
  enable: "Enabled EltenaSoundCore. sounds={sounds} liveAssets={liveAssets} locale={locale}"
  reload: "Reloaded EltenaSoundCore. sounds={sounds} liveAssets={liveAssets} locale={locale}"
  disable: "Disabled EltenaSoundCore."
  dispatch-play: "sound={soundId} player={player} bytes={bytes} category={category}"
  dispatch-stop: "stop category={category} player={player} bytes={bytes} fadeOutMs={fadeOutMs}"
  dispatch-config: "Sent sound config: player={player} bytes={bytes} enabled={enabled} mode={mode} intervalTicks={intervalTicks}"
  dispatch-live-play: "live asset play dispatched: assetId={assetId} player={player} bytes={bytes} category={category}"
  manifest-sent: "manifest sent: player={player} bytes={bytes} assetCount={assetCount}"
  live-asset-requested: "live asset requested: player={player} assetId={assetId}"
  live-asset-request-error: "Failed to handle a live asset request: player={player} message={message}"
  transfer-start: "transfer start: assetId={assetId} player={player} bytes={bytes} totalChunks={totalChunks}"
  transfer-chunk-progress: "transfer chunk: assetId={assetId} player={player} chunk={chunkIndex}/{totalChunks} bytes={bytes}"
  transfer-complete: "transfer complete: assetId={assetId} player={player} bytes={bytes}"
  play-play-sound: "play sound: soundId={soundId} category={category} targets={targetCount} fadeInMs={fadeInMs} fadeOutMs={fadeOutMs}"
  play-stop-sound: "stop sound: category={category} targets={targetCount} fadeOutMs={fadeOutMs}"
  play-live-asset: "play live asset: assetId={assetId} category={category} player={player}"
  unknown-sound-id: "An unknown sound id was requested: soundId={soundId}"
  unknown-category: "An unsupported category was requested: category={category}"
  no-targets-play: "sound={soundId} targets=0"
  no-targets-stop: "stop category={category} targets=0"
  sound-load-summary: "Sound loading complete: loaded={loadedCount} directoryFiles={directoryFiles} skipped={skippedCount} duplicates={duplicateCount}"
  sound-skip-missing-id: "Skipped a sound file because the id is empty: file={file}"
  sound-skip-missing-type: "Skipped a sound file because the type is empty: file={file} soundId={soundId}"
  sound-skip-unsupported-type: "Skipped a sound file because the type is unsupported: file={file} soundId={soundId} type={type}"
  sound-skip-unsupported-category: "Skipped a sound file because the category is unsupported: file={file} soundId={soundId} category={category}"
  sound-duplicate-id: "Detected a duplicate sound id: soundId={soundId} kept={keptFile} ignored={ignoredFile}"
  sound-file-error: "Failed to load a sound definition: file={file} message={message}"
  live-asset-load-summary: "Live asset loading complete: loaded={loadedCount} directoryFiles={directoryFiles} skipped={skippedCount} duplicates={duplicateCount}"
  live-asset-loaded: "live asset loaded: assetId={assetId} type={type} version={version} sizeBytes={sizeBytes}"
  live-asset-skip-missing-id: "Skipped a live asset file because the id is empty: file={file}"
  live-asset-skip-missing-type: "Skipped a live asset file because the type is empty: file={file} assetId={assetId}"
  live-asset-skip-unsupported-type: "Skipped a live asset file because the type is unsupported: file={file} assetId={assetId} type={type}"
  live-asset-skip-unsupported-category: "Skipped a live asset file because the category is unsupported: file={file} assetId={assetId} category={category}"
  live-asset-duplicate-id: "Detected a duplicate live asset id: assetId={assetId} kept={keptFile} ignored={ignoredFile}"
  live-asset-sha-mismatch-config: "Skipped a live asset because the configured sha256 does not match the file: file={file} assetId={assetId} configured={configuredSha256} actual={actualSha256}"
  live-asset-file-error: "Failed to load a live asset definition: file={file} message={message}"
  sound-client-ready-received: "sound client ready received: player={player} protocolVersion={protocolVersion} supportsLiveAssets={supportsLiveAssets}"
  player-ready-registered: "player ready registered: player={player} protocolVersion={protocolVersion} supportsLiveAssets={supportsLiveAssets}"
  player-ready-removed: "player ready removed: player={player} protocolVersion={protocolVersion} supportsLiveAssets={supportsLiveAssets}"
  payload-skipped-not-ready: "payload skipped because player not ready: player={player} payloadType={payloadType} assetId={assetId}"
  sound-config-sent-after-ready: "sound_config sent after ready: player={player} protocolVersion={protocolVersion}"
  live-manifest-sent-by-command: "live manifest sent by command: player={player}"
  live-transfer-started-by-command: "live transfer started by command: player={player} assetId={assetId}"
