meta:
  prefix: "&8[&dEltenaSoundCore&8] &r"
command:
  help:
    header: "&fEltenaSoundCore コマンド:"
    reload: "&e/eltenasound reload &7- 設定を再読み込みします。"
    play: "&e/eltenasound play <soundId> &7- サウンドを再生します。"
    stop: "&e/eltenasound stop <category> [fadeOutMs] &7- カテゴリのサウンドを停止します。"
    live: "&e/eltenasound live <list|reload|play|send-manifest|send> &7- ライブ音声アセットを操作します。"
  reload:
    success: "&a設定を再読み込みしました。 sounds={sounds} liveAssets={liveAssets}"
  play:
    success: "&aサウンド '{displayName}' ({soundId}) を {targetCount} 人へ送信しました。"
  stop:
    success: "&aカテゴリ {category} の停止を {targetCount} 人へ送信しました。"
  live:
    list:
      header: "&fライブアセット一覧: {liveAssets}"
      entry: "&7- &e{assetId} &8(&b{assetType}&8) &7version=&f{version} &7category=&f{category}"
    reload:
      success: "&aライブアセットを再読み込みしました。 sounds={sounds} liveAssets={liveAssets}"
    play:
      success: "&aライブアセット '{displayName}' ({assetId}) の再生指示をクライアントへ送信しました。"
    send-manifest:
      success: "&a{player} へ live asset manifest を送信しました。"
    send:
      success: "&aライブアセット転送を開始しました: player={player} assetId={assetId}"
    error:
      unknown-asset: "&cライブアセット '{assetId}' は定義されていません。"
      player-only: "&cこのコマンドはプレイヤーのみ実行できます。"
      unknown-player: "&cプレイヤー '{player}' はオンラインではありません。"
  error:
    no-permission: "&c権限がありません。"
    unknown-subcommand: "&c不明なサブコマンドです。"
    unknown-sound: "&cサウンド '{soundId}' は定義されていません。"
    unknown-category: "&cカテゴリ '{category}' は未対応です。"
    invalid-number: "&c数値の形式が不正です。 0 以上の整数を指定してください。"
    no-targets-sound: "&eサウンド '{displayName}' の対象プレイヤーがいませんでした。"
    no-targets-category: "&eカテゴリ {category} を送信する対象プレイヤーがいませんでした。"
    player-not-ready: "&c対象プレイヤーは EltenaSound の ready が完了していません。"
    internal: "&cサウンド処理中に内部エラーが発生しました。 詳細はログを確認してください。"
log:
  enable: "EltenaSoundCore を有効化しました。 sounds={sounds} liveAssets={liveAssets} locale={locale}"
  reload: "EltenaSoundCore を再読み込みしました。 sounds={sounds} liveAssets={liveAssets} locale={locale}"
  disable: "EltenaSoundCore を無効化しました。"
  dispatch-play: "sound={soundId} player={player} bytes={bytes} category={category}"
  dispatch-stop: "stop category={category} player={player} bytes={bytes} fadeOutMs={fadeOutMs}"
  dispatch-config: "sound config を送信しました: player={player} bytes={bytes} enabled={enabled} mode={mode} intervalTicks={intervalTicks}"
  dispatch-live-play: "live asset play を送信しました: assetId={assetId} player={player} bytes={bytes} category={category}"
  manifest-sent: "manifest を送信しました: player={player} bytes={bytes} assetCount={assetCount}"
  live-asset-requested: "live asset requested: player={player} assetId={assetId}"
  live-asset-request-error: "live asset request の処理に失敗しました: player={player} message={message}"
  transfer-start: "transfer start: assetId={assetId} player={player} bytes={bytes} totalChunks={totalChunks}"
  transfer-chunk-progress: "transfer chunk: assetId={assetId} player={player} chunk={chunkIndex}/{totalChunks} bytes={bytes}"
  transfer-complete: "transfer complete: assetId={assetId} player={player} bytes={bytes}"
  play-play-sound: "play sound: soundId={soundId} category={category} targets={targetCount} fadeInMs={fadeInMs} fadeOutMs={fadeOutMs}"
  play-stop-sound: "stop sound: category={category} targets={targetCount} fadeOutMs={fadeOutMs}"
  play-live-asset: "play live asset: assetId={assetId} category={category} player={player}"
  unknown-sound-id: "未定義の sound id が要求されました: soundId={soundId}"
  unknown-category: "未対応のカテゴリが要求されました: category={category}"
  no-targets-play: "sound={soundId} targets=0"
  no-targets-stop: "stop category={category} targets=0"
  sound-load-summary: "サウンド読み込み完了: loaded={loadedCount} directoryFiles={directoryFiles} skipped={skippedCount} duplicates={duplicateCount}"
  sound-skip-missing-id: "サウンド id が空のためスキップしました: file={file}"
  sound-skip-missing-type: "サウンド type が空のためスキップしました: file={file} soundId={soundId}"
  sound-skip-unsupported-type: "未対応のサウンド type のためスキップしました: file={file} soundId={soundId} type={type}"
  sound-skip-unsupported-category: "未対応のカテゴリのためスキップしました: file={file} soundId={soundId} category={category}"
  sound-duplicate-id: "重複する sound id を検出しました: soundId={soundId} kept={keptFile} ignored={ignoredFile}"
  sound-file-error: "サウンド定義の読み込みに失敗しました: file={file} message={message}"
  live-asset-load-summary: "ライブアセット読み込み完了: loaded={loadedCount} directoryFiles={directoryFiles} skipped={skippedCount} duplicates={duplicateCount}"
  live-asset-loaded: "live asset loaded: assetId={assetId} type={type} version={version} sizeBytes={sizeBytes}"
  live-asset-skip-missing-id: "ライブアセット id が空のためスキップしました: file={file}"
  live-asset-skip-missing-type: "ライブアセット type が空のためスキップしました: file={file} assetId={assetId}"
  live-asset-skip-unsupported-type: "未対応のライブアセット type のためスキップしました: file={file} assetId={assetId} type={type}"
  live-asset-skip-unsupported-category: "未対応のカテゴリのライブアセットをスキップしました: file={file} assetId={assetId} category={category}"
  live-asset-duplicate-id: "重複する live asset id を検出しました: assetId={assetId} kept={keptFile} ignored={ignoredFile}"
  live-asset-sha-mismatch-config: "設定 sha256 とファイル sha256 が一致しないためスキップしました: file={file} assetId={assetId} configured={configuredSha256} actual={actualSha256}"
  live-asset-file-error: "ライブアセット定義の読み込みに失敗しました: file={file} message={message}"
  sound-client-ready-received: "sound client ready を受信しました: player={player} protocolVersion={protocolVersion} supportsLiveAssets={supportsLiveAssets}"
  player-ready-registered: "player ready を登録しました: player={player} protocolVersion={protocolVersion} supportsLiveAssets={supportsLiveAssets}"
  player-ready-removed: "player ready を削除しました: player={player} protocolVersion={protocolVersion} supportsLiveAssets={supportsLiveAssets}"
  payload-skipped-not-ready: "player が ready ではないため payload を送信しませんでした: player={player} payloadType={payloadType} assetId={assetId}"
  sound-config-sent-after-ready: "ready 後に sound_config を送信しました: player={player} protocolVersion={protocolVersion}"
  live-manifest-sent-by-command: "コマンドで live manifest を送信しました: player={player}"
  live-transfer-started-by-command: "コマンドで live transfer を開始しました: player={player} assetId={assetId}"
