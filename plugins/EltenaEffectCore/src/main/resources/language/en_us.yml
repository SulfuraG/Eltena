meta:
  prefix: "&8[&bEltenaEffectCore&8] &r"
command:
  help:
    header: "&fEltenaEffectCore commands:"
    reload: "&e/eltenaeffect reload &7- Reloads configuration files."
    play-self: "&e/eltenaeffect play <effectId> &7- Plays an effect at your current position."
    play-here: "&e/eltenaeffect play <effectId> here &7- Plays an effect at the execution point."
    play-at: "&e/eltenaeffect play <effectId> at <world> <x> <y> <z> &7- Plays an effect at explicit coordinates."
    mm-play: "&e/eltenaeffect mm play <effectId> <world> <x> <y> <z> &7- Plays an effect at explicit coordinates for MythicMobs or console use."
    mm-caster-play: "&e/eltenaeffect mm-caster-play <effectId> <entityUuid> &7- Resolves the caster UUID and plays an effect at that entity location."
    trigger-list: "&e/eltenaeffect trigger list &7- Lists loaded area triggers."
    trigger-reload: "&e/eltenaeffect trigger reload &7- Reloads configuration files including area triggers."
    trigger-debug: "&e/eltenaeffect trigger debug <player> &7- Shows which trigger boxes currently contain the player."
    sequence-self: "&e/eltenaeffect sequence <sequenceId> &7- Plays a sequence at your current position."
    sequence-here: "&e/eltenaeffect sequence <sequenceId> here &7- Plays a sequence at the execution point."
    sequence-at: "&e/eltenaeffect sequence <sequenceId> at <world> <x> <y> <z> &7- Plays a sequence at explicit coordinates."
    mm-sequence: "&e/eltenaeffect mm sequence <sequenceId> <world> <x> <y> <z> &7- Plays a sequence at explicit coordinates for MythicMobs or console use."
    mm-caster-sequence: "&e/eltenaeffect mm-caster-sequence <sequenceId> <entityUuid> &7- Resolves the caster UUID and plays a sequence at that entity location."
  reload:
    success: "&aReloaded configuration files. effects={effects} sequences={sequences} triggers={triggers}"
  play:
    success: "&aSent effect '{displayName}' ({effectId}) to {targetCount} players."
    success-repeat: "&7Scheduled {repeatCount} follow-up repeats."
  sequence:
    success: "&aScheduled sequence '{displayName}' ({sequenceId}) with {stepCount} steps."
  trigger:
    list-header: "&fLoaded area triggers: &b{triggerCount}"
    list-empty: "&7No area triggers are loaded."
    list-entry: "&8- &b{triggerId} &7({displayName}) enabled={enabled} world={world} cooldownMs={cooldownMs} actions=[{actions}]"
    debug-header: "&fTriggers currently containing {player}: &7world={world} x={x} y={y} z={z}"
    debug-empty: "&7The player is not inside any trigger boxes."
    debug-entry: "&8- &b{triggerId} &7({displayName}) enabled={enabled}"
  error:
    no-permission: "&cYou do not have permission."
    player-or-location-required: "&cThis command needs a player position or an execution location."
    unknown-subcommand: "&cUnknown subcommand."
    unknown-effect: "&cEffect '{effectId}' is not defined."
    unknown-sequence: "&cSequence '{sequenceId}' is not defined."
    world-not-found: "&cWorld '{world}' was not found."
    invalid-number: "&cCoordinates must be numeric."
    invalid-uuid: "&cThe entityUuid must be a valid UUID."
    entity-not-found: "&cEntity '{entityUuid}' was not found."
    entity-dead: "&cEntity '{entityUuid}' is invalid or dead."
    player-not-found: "&cPlayer '{player}' is not online."
    no-targets: "&eNo target players were found for effect '{displayName}'."
    internal: "&cAn internal effect error occurred. Check the server log for details."
log:
  enable: "Enabled EltenaEffectCore. effects={effects} sequences={sequences} triggers={triggers} locale={locale}"
  reload: "Reloaded EltenaEffectCore. effects={effects} sequences={sequences} triggers={triggers} locale={locale}"
  disable: "Disabled EltenaEffectCore."
  dispatch: "effect={effectId} player={player} bytes={bytes} power={power}"
  no-targets: "effect={effectId} world={world} x={x} y={y} z={z} targets=0"
  scheduled-repeat: "effect={effectId} repeatIndex={repeatIndex} delayTicks={delayTicks}"
  effect-load-summary: "Effect loading complete: loaded={loadedCount} directoryFiles={directoryFiles} legacyEntries={legacyEntries} skipped={skippedCount} duplicates={duplicateCount}"
  effect-skip-missing-id: "Skipped an effect file because the id is empty: file={file}"
  effect-skip-missing-type: "Skipped an effect file because the type is empty: file={file} effectId={effectId}"
  effect-skip-unsupported-type: "Skipped an effect file because the type is unsupported: file={file} effectId={effectId} type={type}"
  effect-duplicate-id: "Detected a duplicate effect id: effectId={effectId} kept={keptFile} ignored={ignoredFile}"
  effect-legacy-missing-root: "Skipped effects.yml because the effects section is missing: file={file}"
  effect-file-error: "Failed to load an effect definition: file={file} message={message}"
  sequence-load-summary: "Sequence loading complete: loaded={loadedCount} directoryFiles={directoryFiles} skipped={skippedCount} duplicates={duplicateCount}"
  sequence-skip-missing-id: "Skipped a sequence file because the id is empty: file={file}"
  sequence-skip-missing-steps: "Skipped a sequence file because the steps are empty: file={file} sequenceId={sequenceId}"
  sequence-duplicate-id: "Detected a duplicate sequence id: sequenceId={sequenceId} kept={keptFile} ignored={ignoredFile}"
  sequence-file-error: "Failed to load a sequence definition: file={file} message={message}"
  sequence-start: "sequence={sequenceId} steps={stepCount} world={world} x={x} y={y} z={z}"
  sequence-step: "sequence={sequenceId} step={stepIndex}/{stepCount} type={stepType} id={stepId} delayMs={delayMs} delayTicks={delayTicks}"
  sequence-missing-effect: "sequence={sequenceId} step={stepIndex}/{stepCount} missingEffect={effectId}"
  sequence-missing-sound: "sequence={sequenceId} step={stepIndex}/{stepCount} missingSound={soundId}"
  sequence-sound-service-unavailable: "sequence={sequenceId} step={stepIndex}/{stepCount} soundServiceUnavailable={pluginName}"
  sequence-complete: "sequence={sequenceId} steps={stepCount} complete=true"
  area-trigger-load-summary: "Area trigger loading complete: loaded={loadedCount} directoryFiles={directoryFiles} skipped={skippedCount} duplicates={duplicateCount}"
  area-trigger-loaded: "areaTriggerLoaded id={triggerId} enabled={enabled} world={world} actionCount={actionCount}"
  area-trigger-skipped: "areaTriggerSkipped file={file} reason={reason}"
  area-trigger-skip-missing-id: "Skipped an area trigger file because the id is empty: file={file}"
  area-trigger-skip-invalid-trigger: "Skipped an area trigger because the trigger section is invalid: file={file} triggerId={triggerId}"
  area-trigger-skip-invalid-world: "Skipped an area trigger because the world was not found: file={file} triggerId={triggerId} world={world}"
  area-trigger-skip-invalid-box: "Skipped an area trigger because the box bounds are invalid: file={file} triggerId={triggerId}"
  area-trigger-skip-invalid-action: "Skipped an area trigger because an action is invalid: file={file} triggerId={triggerId}"
  area-trigger-duplicate-id: "Detected a duplicate area trigger id: triggerId={triggerId} kept={keptFile} ignored={ignoredFile}"
  area-trigger-file-error: "Failed to load an area trigger definition: file={file} message={message}"
  area-trigger-player-entered: "player={player} triggerEntered={triggerId}"
  area-trigger-action-play: "player={player} triggerId={triggerId} actionType={actionType} actionId={actionId}"
  area-trigger-cooldown-active: "player={player} triggerId={triggerId} cooldownRemainingMs={remainingMs}"
  area-trigger-bypassed: "player={player} triggerId={triggerId} bypassPermission={permission}"
  area-trigger-action-missing: "triggerId={triggerId} actionType={actionType} actionId={actionId} missing=true"
