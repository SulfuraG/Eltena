meta:
  prefix: "&8[&bEltenaEffectCore&8] &r"
command:
  help:
    header: "&fEltenaEffectCore コマンド:"
    reload: "&e/eltenaeffect reload &7- 設定を再読み込みします。"
    play-self: "&e/eltenaeffect play <effectId> &7- 自分の位置で演出を再生します。"
    play-here: "&e/eltenaeffect play <effectId> here &7- 実行地点で演出を再生します。"
    play-at: "&e/eltenaeffect play <effectId> at <world> <x> <y> <z> &7- 指定地点で演出を再生します。"
    mm-play: "&e/eltenaeffect mm play <effectId> <world> <x> <y> <z> &7- MythicMobs やコンソール向けに指定座標で演出を再生します。"
    mm-caster-play: "&e/eltenaeffect mm-caster-play <effectId> <entityUuid> &7- MythicMobs の caster UUID から座標を自動解決して演出を再生します。"
    trigger-list: "&e/eltenaeffect trigger list &7- 読み込み済みのエリアトリガー一覧を表示します。"
    trigger-reload: "&e/eltenaeffect trigger reload &7- エリアトリガーを含む設定を再読み込みします。"
    trigger-debug: "&e/eltenaeffect trigger debug <player> &7- 指定プレイヤーが現在入っているトリガーを表示します。"
    sequence-self: "&e/eltenaeffect sequence <sequenceId> &7- 自分の位置でシーケンス演出を再生します。"
    sequence-here: "&e/eltenaeffect sequence <sequenceId> here &7- 実行地点でシーケンス演出を再生します。"
    sequence-at: "&e/eltenaeffect sequence <sequenceId> at <world> <x> <y> <z> &7- 指定地点でシーケンス演出を再生します。"
    mm-sequence: "&e/eltenaeffect mm sequence <sequenceId> <world> <x> <y> <z> &7- MythicMobs やコンソール向けに指定座標でシーケンスを再生します。"
    mm-caster-sequence: "&e/eltenaeffect mm-caster-sequence <sequenceId> <entityUuid> &7- MythicMobs の caster UUID から座標を自動解決してシーケンスを再生します。"
  reload:
    success: "&a設定を再読み込みしました。 effects={effects} sequences={sequences} triggers={triggers}"
  play:
    success: "&a演出 '{displayName}' ({effectId}) を {targetCount} 人へ送信しました。"
    success-repeat: "&7繰り返し送信を {repeatCount} 回予約しました。"
  sequence:
    success: "&aシーケンス '{displayName}' ({sequenceId}) を {stepCount} ステップで予約しました。"
  trigger:
    list-header: "&f読み込み済みエリアトリガー: &b{triggerCount}"
    list-empty: "&7エリアトリガーはありません。"
    list-entry: "&8- &b{triggerId} &7({displayName}) enabled={enabled} world={world} cooldownMs={cooldownMs} actions=[{actions}]"
    debug-header: "&f{player} が現在入っているトリガー: &7world={world} x={x} y={y} z={z}"
    debug-empty: "&7現在入っているトリガーはありません。"
    debug-entry: "&8- &b{triggerId} &7({displayName}) enabled={enabled}"
  error:
    no-permission: "&c権限がありません。"
    player-or-location-required: "&cこの実行方法ではプレイヤー位置または実行地点が必要です。"
    unknown-subcommand: "&c不明なサブコマンドです。"
    unknown-effect: "&cエフェクト '{effectId}' は定義されていません。"
    unknown-sequence: "&cシーケンス '{sequenceId}' は定義されていません。"
    world-not-found: "&cワールド '{world}' が見つかりません。"
    invalid-number: "&c座標は数値で指定してください。"
    invalid-uuid: "&centityUuid は UUID 形式で指定してください。"
    entity-not-found: "&centityUuid '{entityUuid}' の entity が見つかりません。"
    entity-dead: "&centityUuid '{entityUuid}' の entity はすでに無効または dead です。"
    player-not-found: "&cプレイヤー '{player}' はオンラインではありません。"
    no-targets: "&e演出 '{displayName}' の対象プレイヤーはいませんでした。"
    internal: "&cエフェクト処理中にエラーが発生しました。詳細はログを確認してください。"
log:
  enable: "EltenaEffectCore を有効化しました。 effects={effects} sequences={sequences} triggers={triggers} locale={locale}"
  reload: "EltenaEffectCore を再読み込みしました。 effects={effects} sequences={sequences} triggers={triggers} locale={locale}"
  disable: "EltenaEffectCore を無効化しました。"
  dispatch: "effect={effectId} player={player} bytes={bytes} power={power}"
  no-targets: "effect={effectId} world={world} x={x} y={y} z={z} targets=0"
  scheduled-repeat: "effect={effectId} repeatIndex={repeatIndex} delayTicks={delayTicks}"
  effect-load-summary: "エフェクト読み込み完了: loaded={loadedCount} directoryFiles={directoryFiles} legacyEntries={legacyEntries} skipped={skippedCount} duplicates={duplicateCount}"
  effect-skip-missing-id: "エフェクト id が空のためスキップしました: file={file}"
  effect-skip-missing-type: "エフェクト type が空のためスキップしました: file={file} effectId={effectId}"
  effect-skip-unsupported-type: "未対応のエフェクト type のためスキップしました: file={file} effectId={effectId} type={type}"
  effect-duplicate-id: "重複する effect id を検出しました: effectId={effectId} kept={keptFile} ignored={ignoredFile}"
  effect-legacy-missing-root: "effects.yml に effects セクションがないためスキップしました: file={file}"
  effect-file-error: "エフェクト読み込みに失敗しました: file={file} message={message}"
  sequence-load-summary: "シーケンス読み込み完了: loaded={loadedCount} directoryFiles={directoryFiles} skipped={skippedCount} duplicates={duplicateCount}"
  sequence-skip-missing-id: "シーケンス id が空のためスキップしました: file={file}"
  sequence-skip-missing-steps: "シーケンス steps が空のためスキップしました: file={file} sequenceId={sequenceId}"
  sequence-duplicate-id: "重複する sequence id を検出しました: sequenceId={sequenceId} kept={keptFile} ignored={ignoredFile}"
  sequence-file-error: "シーケンス読み込みに失敗しました: file={file} message={message}"
  sequence-start: "sequence={sequenceId} steps={stepCount} world={world} x={x} y={y} z={z}"
  sequence-step: "sequence={sequenceId} step={stepIndex}/{stepCount} type={stepType} id={stepId} delayMs={delayMs} delayTicks={delayTicks}"
  sequence-missing-effect: "sequence={sequenceId} step={stepIndex}/{stepCount} missingEffect={effectId}"
  sequence-missing-sound: "sequence={sequenceId} step={stepIndex}/{stepCount} missingSound={soundId}"
  sequence-sound-service-unavailable: "sequence={sequenceId} step={stepIndex}/{stepCount} soundServiceUnavailable={pluginName}"
  sequence-complete: "sequence={sequenceId} steps={stepCount} complete=true"
  area-trigger-load-summary: "エリアトリガー読み込み完了: loaded={loadedCount} directoryFiles={directoryFiles} skipped={skippedCount} duplicates={duplicateCount}"
  area-trigger-loaded: "areaTriggerLoaded id={triggerId} enabled={enabled} world={world} actionCount={actionCount}"
  area-trigger-skipped: "areaTriggerSkipped file={file} reason={reason}"
  area-trigger-skip-missing-id: "エリアトリガー id が空のためスキップしました: file={file}"
  area-trigger-skip-invalid-trigger: "trigger 定義が不正なためエリアトリガーをスキップしました: file={file} triggerId={triggerId}"
  area-trigger-skip-invalid-world: "world が不明なためエリアトリガーをスキップしました: file={file} triggerId={triggerId} world={world}"
  area-trigger-skip-invalid-box: "box 範囲が不正なためエリアトリガーをスキップしました: file={file} triggerId={triggerId}"
  area-trigger-skip-invalid-action: "action 定義が不正なためエリアトリガーをスキップしました: file={file} triggerId={triggerId}"
  area-trigger-duplicate-id: "重複する area trigger id を検出しました: triggerId={triggerId} kept={keptFile} ignored={ignoredFile}"
  area-trigger-file-error: "エリアトリガー読み込みに失敗しました: file={file} message={message}"
  area-trigger-player-entered: "player={player} triggerEntered={triggerId}"
  area-trigger-action-play: "player={player} triggerId={triggerId} actionType={actionType} actionId={actionId}"
  area-trigger-cooldown-active: "player={player} triggerId={triggerId} cooldownRemainingMs={remainingMs}"
  area-trigger-bypassed: "player={player} triggerId={triggerId} bypassPermission={permission}"
  area-trigger-action-missing: "triggerId={triggerId} actionType={actionType} actionId={actionId} missing=true"
