# サーバー側正本の固定座標カメラです。
# fixed_world は指定したワールド座標と角度をそのまま target に使います。
# 現段階では確認優先のため移動を許可していますが、固定演出用 preset として使う想定です。

preset:
  id: fixed_showcase
  display-name: "固定座標カメラ"
  enabled: true
  mode: fixed_world

  world-position:
    world: "world"
    x: 0.5
    y: 80.0
    z: 8.5

  rotation:
    yaw: 180.0
    pitch: 12.0
    roll: 0.0

  movement:
    allow-player-movement: true
    allow-camera-movement: false
    lock-player-input: false

  smoothing:
    enabled: true
    position-smooth-time: 1.0
    rotation-smooth-time: 0.6

  behavior:
    reset-on-disable: true
    restore-player-camera-on-disable: true
    use-virtual-entity-camera: true
