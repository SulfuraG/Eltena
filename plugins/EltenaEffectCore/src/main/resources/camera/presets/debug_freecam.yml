# サーバー側正本の検証用相対カメラです。
# smoothing を切って、target がどこに置かれるか即座に確認できます。

preset:
  id: debug_freecam
  display-name: "デバッグFreeCam"
  enabled: true
  mode: relative_player

  relative-position:
    distance: 7.0
    vertical-offset: 3.0
    horizontal-offset: 0.0
    forward-offset: 0.0

  movement:
    allow-player-movement: true
    allow-camera-movement: false
    lock-player-input: false

  smoothing:
    enabled: false
    position-smooth-time: 0.0
    rotation-smooth-time: 0.0

  behavior:
    reset-on-disable: true
    restore-player-camera-on-disable: true
    use-virtual-entity-camera: true
