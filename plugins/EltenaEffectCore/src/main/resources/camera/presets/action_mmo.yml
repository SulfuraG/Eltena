# サーバー側正本の相対戦闘確認カメラです。

preset:
  id: action_mmo
  display-name: "アクションMMOカメラ"
  enabled: true
  mode: relative_player

  relative-position:
    distance: 5.0
    vertical-offset: 1.8
    horizontal-offset: 1.0
    forward-offset: 0.3

  movement:
    allow-player-movement: true
    allow-camera-movement: false
    lock-player-input: false

  smoothing:
    # true の場合、現在カメラ位置から target へ滑らかに近づけます。
    enabled: true
    # 小さいほど速く、大きいほどゆっくり移動します。
    position-smooth-time: 0.14
    rotation-smooth-time: 0.10

  behavior:
    reset-on-disable: true
    restore-player-camera-on-disable: true
    use-virtual-entity-camera: true
