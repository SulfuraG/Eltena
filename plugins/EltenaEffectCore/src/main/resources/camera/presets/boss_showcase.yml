# サーバー側正本のボス演出向け固定座標カメラです。
# 現段階では確認優先のため移動を許可していますが、固定演出用 preset として使う想定です。

preset:
  id: boss_showcase
  display-name: "ボス演出カメラ"
  enabled: true
  mode: fixed_world

  world-position:
    world: "world"
    x: 14.5
    y: 88.0
    z: 20.5

  rotation:
    yaw: 225.0
    pitch: 18.0
    roll: 0.0

  movement:
    allow-player-movement: true
    allow-camera-movement: false
    lock-player-input: false

  smoothing:
    enabled: true
    position-smooth-time: 1.2
    rotation-smooth-time: 0.75

  behavior:
    reset-on-disable: true
    restore-player-camera-on-disable: true
    use-virtual-entity-camera: true
