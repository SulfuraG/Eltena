# サーバー側正本の俯瞰固定座標カメラです。

preset:
  id: overhead
  display-name: "俯瞰カメラ"
  enabled: true
  mode: fixed_world

  world-position:
    world: "world"
    x: 0.5
    y: 92.0
    z: 0.5

  rotation:
    yaw: 180.0
    pitch: 82.0
    roll: 0.0

  movement:
    allow-player-movement: true
    allow-camera-movement: false
    lock-player-input: false

  smoothing:
    enabled: true
    position-smooth-time: 1.4
    rotation-smooth-time: 0.7

  behavior:
    reset-on-disable: true
    restore-player-camera-on-disable: true
    use-virtual-entity-camera: true
